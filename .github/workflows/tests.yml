name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rbac-lint:
    name: RBAC linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/ -v

      - name: canary, the linter must find the roles this repo plants on purpose
        # Unit tests all feed analyze_text hand-written single-document
        # manifests, which is not the shape the linter meets in use. Against a
        # live cluster it once reported "No risky RBAC found" with four
        # cluster-admin-equivalent roles present, because kubectl -o json wraps
        # everything in kind: List. See scripts/canary.sh for the full reasoning.
        run: bash scripts/canary.sh

  kubeconform:
    name: Manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        env:
          KUBECONFORM_VERSION: "0.6.7"
        # --fail and --retry, both load-bearing.
        #
        # Without --fail, curl writes whatever it got (a 404 page, a proxy
        # error, a truncated body) to the file and exits 0. tar then dies with
        # "Error is not recoverable", which says nothing about the actual
        # problem. That is precisely how this job failed, and it is the same
        # trap already fixed in lab 07's installer.
        #
        # --retry covers the transient case, which is the likelier cause here:
        # the pinned tag and asset name both still exist upstream.
        run: |
          set -euo pipefail
          url="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSL --fail --retry 3 --retry-delay 2 -o kc.tar.gz "$url"
          tar xzf kc.tar.gz kubeconform
          # Prove the binary actually runs before trusting anything it says.
          ./kubeconform -v
      - name: validate manifests
        # -skip Cluster: kind-config.yaml is a kind CLI config (kind.x-k8s.io),
        # not a Kubernetes API object, so there's no schema to validate it against.
        run: ./kubeconform -strict -summary -skip Cluster k8s/
