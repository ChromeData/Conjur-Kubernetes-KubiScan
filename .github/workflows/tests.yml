name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rbac-lint:
    name: RBAC linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/ -v

  kubeconform:
    name: Manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -sSLo kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kc.tar.gz kubeconform
      - name: validate manifests
        # -skip Cluster: kind-config.yaml is a kind CLI config (kind.x-k8s.io),
        # not a Kubernetes API object, so there's no schema to validate it against.
        run: ./kubeconform -strict -summary -skip Cluster k8s/
